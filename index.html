<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Scholarship Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <h1>Scholarship Tracker</h1><div id="auth-section">
    <h2>Log In / Sign Up</h2>
    <input type="email" id="auth-email" placeholder="Email">
    <input type="password" id="auth-password" placeholder="Password">
    <button id="signup-btn">Sign Up</button>
    <button id="login-btn">Log In</button>
    <p id="auth-message"></p>
  </div>

  <div id="app-section" style="display: none;">
    <p>Logged in as <span id="user-email"></span> — <button id="logout-btn">Log Out</button></p>
  <div id="summary" class="summary"></div>
<h2>Add a New Scholarship</h2>
  <form id="scholarship-form">
    <input type="text" id="name-input" placeholder="Scholarship name" required>
    <input type="text" id="amount-input" placeholder="Amount (e.g. $1,000)" required>
    <input type="date" id="due-input" required>
    <select id="category-input" required>
      <option value="" disabled selected>Category</option>
      <option value="Institutional">Institutional</option>
      <option value="State">State</option>
      <option value="National">National</option>
      <option value="Local/Community">Local/Community</option>
      <option value="Specialty/Professional">Specialty/Professional</option>
      <option value="Service-Based">Service-Based</option>
      <option value="Other">Other</option>
    </select>
    <textarea id="notes-input" placeholder="Notes (optional)"></textarea>
    <button type="submit">Add Scholarship</button>
  </form>

  <h2>My Scholarships</h2>
  <ul id="scholarship-list"></ul>
  <h2>Financial Impact</h2>
  <form id="assumptions-form" class="assumptions-form">
    <label>
      Annual tuition ($)
      <input type="number" id="tuition-input" min="0" step="100" required>
    </label>
    <label>
      Years remaining
      <input type="number" id="years-input" min="0" step="1" required>
    </label>
    <label>
      Existing debt ($)
      <input type="number" id="debt-input" min="0" step="100" required>
    </label>
    <label>
      Est. loan interest rate (%)
      <input type="number" id="rate-input" min="0" step="0.1" required>
    </label>
    <button type="submit">Save Assumptions</button>
  </form>

  <div id="financial-summary" class="financial-summary"></div>
  <p class="disclaimer">These are simplified educational estimates based on the assumptions above — not a personalized financial or loan calculation.</p>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabaseClient.js"></script>    
  <script src="auth.js"></script>
  <script src="financial.js"></script>
  <script src="tasks.js"></script>
  <script src="script.js"></script>
<script src="script.js"></script>
</div> <!-- closes app-section -->

</body>
</html>
